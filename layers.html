<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Электроны по слоям</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--pu:#8153EC;--pu-d:#6a3fd6;--lv:#EFEAFF;--lv2:#E3DAFF;--ln:#D9CCFF;--ink:#1d1b26;--grey:#737373;--ok:#1f9d6b;--ok-bg:#e3f6ee;--bad:#e0475b;--bad-bg:#fde8eb;--bg:#f7f5ff;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-weight:500}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
.back{display:inline-flex;gap:6px;color:var(--pu);font-weight:600;font-size:14px;text-decoration:none;margin-bottom:14px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-family:Unbounded,Montserrat,sans-serif;font-weight:600;color:var(--pu);font-size:24px;margin:0}
.head span{color:#be9fff;font-size:15px}
.line{height:3px;width:220px;border-radius:2px;background:linear-gradient(90deg,var(--pu),#c553ec);margin-bottom:22px}
.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 2px 0 var(--ln),0 10px 30px rgba(129,83,236,.08)}
.pill{display:inline-block;font-family:Unbounded,Montserrat,sans-serif;font-size:13px;color:var(--pu);background:var(--lv);border:1.5px solid var(--pu);border-radius:7px;padding:4px 10px;box-shadow:3px -2px 0 var(--lv2)}
label{display:block;font-weight:600;margin:18px 0 6px}
input.name{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;outline:none}
input.name:focus{border-color:var(--pu)}
.rules{margin:16px 0 0;padding-left:20px;line-height:1.6}
.rules b{color:var(--pu)}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;background:var(--pu);color:#fff}
.btn:hover{background:var(--pu-d)}
.btn.ghost{background:var(--lv);color:var(--pu)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:18px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--grey);margin-bottom:8px}
.bar{height:8px;background:var(--lv);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),#c553ec);width:0;transition:width .3s}
.lvl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--pu);background:var(--lv);padding:4px 9px;border-radius:20px}
.q{text-align:center;margin:4px 0 10px;color:var(--grey);font-size:15px}
.el{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0 20px}
.sym{font-size:44px;font-weight:700;color:var(--pu);background:var(--lv);border-radius:14px;padding:6px 16px;box-shadow:inset 0 -3px 0 var(--pu);line-height:1.2}
.sym sup{font-size:.45em}
.el small{display:block;color:var(--grey);font-size:14px}
.el b{font-size:18px}
/* layers */
.scheme{display:flex;align-items:flex-start;justify-content:center;gap:6px;font-weight:700}
.nuc{color:var(--pu);font-size:24px;height:84px;display:flex;align-items:center;margin-right:2px}
.shell{display:flex;flex-direction:column;align-items:center;gap:6px}
.arc{align-self:flex-start;width:23px;height:84px;border-right:3px solid var(--pu);border-radius:0 50% 50% 0 / 0 50% 50% 0;opacity:.55}
.shell .cell{width:46px;height:44px;font-size:20px}
.cell{width:56px;height:52px;text-align:center;font:700 22px Montserrat,sans-serif;border:1.5px solid var(--ln);border-radius:12px;outline:none;color:var(--ink);background:#fff}
.cell:focus{border-color:var(--pu)}
.cell.right{border-color:var(--ok);background:var(--ok-bg)}
.cell.wrong{border-color:var(--bad);background:var(--bad-bg)}
/* config */
.subs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sub{display:flex;flex-direction:column;align-items:center;gap:4px}
.sub span{font-weight:700;font-size:16px}
.sub em{font-style:normal;font-size:11px;color:var(--grey)}
.sub .cell{width:100%;max-width:58px;height:48px;font-size:20px}
.order{font-size:12px;color:var(--grey);text-align:center;margin-top:8px}
.preview{text-align:center;font-size:20px;font-weight:600;margin-top:14px;min-height:30px;letter-spacing:.3px}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;line-height:1.55;display:none}
.fb.ok{display:block;background:var(--ok-bg)} .fb.bad{display:block;background:var(--bad-bg)}
.fb b.h{display:block;margin-bottom:2px}
.fb.ok b.h{color:var(--ok)} .fb.bad b.h{color:var(--bad)}
.hint{font-size:13px;color:var(--grey);margin-top:12px;text-align:center}
.res-name{font-size:18px;font-weight:700}
.res-meta{color:var(--grey);font-size:14px;margin-top:4px}
.score{display:flex;align-items:center;gap:20px;margin:22px 0;flex-wrap:wrap}
.score .big{font-family:Unbounded,Montserrat,sans-serif;font-size:64px;color:var(--pu);line-height:1}
.score .big small{font-size:.45em;color:var(--grey)}
.score .verdict{font-size:18px;font-weight:700}
.score .pct{color:var(--grey);font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:20px}
.grid div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.grid .g{background:var(--ok)} .grid .r{background:var(--bad)}
.mist h3{font-size:15px;margin:0 0 8px;color:var(--pu)}
.mist table{width:100%;border-collapse:collapse;font-size:14px}
.mist td,.mist th{border:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top}
.mist td{overflow-wrap:anywhere}
.mist th{background:var(--lv);color:var(--pu)}
.mist .no{color:var(--bad);font-weight:600} .mist .yes{color:var(--ok);font-weight:600}
.perfect{background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:12px;padding:12px 16px}
.foot{font-size:12px;color:var(--grey);margin-top:16px}
.hidden{display:none}
@media (max-width:560px){
  .subs{grid-template-columns:repeat(4,1fr)}
  .card{padding:18px}
  .cell{width:48px;height:48px;font-size:20px}
  .score .big{font-size:52px}
  .grid{gap:4px}
}

.levels{display:grid;gap:10px;margin-top:16px}
.lv-btn{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--ln);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink);transition:border-color .12s,transform .12s}
.lv-btn:hover{border-color:var(--pu);transform:translateY(-1px)}
.lv-btn .dot{flex:none;width:40px;height:40px;border-radius:12px;background:var(--lv);color:var(--pu);display:grid;place-items:center;font-weight:700;font-size:16px}
.lv-btn b{display:block;font-size:17px}
.lv-btn small{display:block;color:var(--grey);font-size:13px;line-height:1.4;margin-top:2px}
.lv-note{color:var(--grey);font-size:13px;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Все тренажёры</a>
  <div class="head"><h1>Электроны по слоям</h1><span>тренажёр</span></div>
  <div class="line"></div>

  <section id="start" class="card">
    <span class="pill">Выбери уровень</span>
    <div class="levels" id="levels"></div>
    <p class="lv-note">В каждом уровне 12 заданий, после каждого ответа — разбор.</p>
  </section>

  <section id="quiz" class="card hidden">
    <div class="top"><span id="num"></span><span class="lvl" id="lvl"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="q" id="qtext"></div>
    <div class="el"><div class="sym" id="sym"></div><div><b id="ename"></b><small id="ez"></small></div></div>
    <div id="work"></div>
    <div class="fb" id="fb"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="check">Проверить</button>
      <button class="btn hidden" id="next">Дальше</button>
    </div>
    <div class="hint">Пустая клетка = 0 · Enter — проверить / дальше</div>
  </section>

  <section id="result" class="card hidden">
    <span class="pill">Результат</span>
    <div style="margin-top:16px"><div class="res-name" id="rName"></div><div class="res-meta" id="rMeta"></div></div>
    <div class="score"><div class="big" id="rScore"></div><div><div class="verdict" id="rVerdict"></div><div class="pct" id="rPct"></div></div></div>
    <div class="grid" id="rGrid"></div>
    <div class="mist" id="rMist"></div>
    
    <div class="row"><button class="btn" id="againLvl">Ещё раз</button><button class="btn ghost" id="toLevels">Другой уровень</button></div>
  </section>
</div>

<script>
const MODE='layers'; // 'layers' — электроны по слоям, 'config' — электронная формула
const EL=[null,['H','водород'],['He','гелий'],['Li','литий'],['Be','бериллий'],['B','бор'],['C','углерод'],['N','азот'],['O','кислород'],['F','фтор'],['Ne','неон'],['Na','натрий'],['Mg','магний'],['Al','алюминий'],['Si','кремний'],['P','фосфор'],['S','сера'],['Cl','хлор'],['Ar','аргон'],['K','калий'],['Ca','кальций'],['Sc','скандий'],['Ti','титан'],['V','ванадий'],['Cr','хром'],['Mn','марганец'],['Fe','железо'],['Co','кобальт'],['Ni','никель'],['Cu','медь'],['Zn','цинк'],['Ga','галлий'],['Ge','германий'],['As','мышьяк'],['Se','селен'],['Br','бром'],['Kr','криптон']];
const ORDER=['1s','2s','2p','3s','3p','4s','3d','4p'];
const CAP={s:2,p:6,d:10};
const LAYOUT=['1s','2s','2p','3s','3p','3d','4s','4p']; // порядок записи по слоям
const SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻'};
const sup=s=>String(s).split('').map(c=>SUPD[c]||c).join('');

function atomCfg(Z){
  const c={};let left=Z;
  for(const o of ORDER){const n=Math.min(CAP[o[1]],left);if(n>0)c[o]=n;left-=n;if(!left)break;}
  if(Z===24){c['4s']=1;c['3d']=5;}
  if(Z===29){c['4s']=1;c['3d']=10;}
  return c;
}
function ionCfg(Z,q){
  const c=atomCfg(Z);
  if(q>0){ // уходят электроны с самого дальнего слоя: 4p, 4s, потом 3d
    let k=q;const rm=Object.keys(c).sort((a,b)=>(+b[0]-+a[0])||('spd'.indexOf(b[1])-'spd'.indexOf(a[1])));
    for(const o of rm){while(k>0&&c[o]>0){c[o]--;k--;}if(!c[o])delete c[o];}
  }else if(q<0){
    let k=-q;for(const o of ORDER){const free=CAP[o[1]]-(c[o]||0);const add=Math.min(free,k);if(add>0)c[o]=(c[o]||0)+add;k-=add;if(!k)break;}
  }
  return c;
}
function layers(c){const L=[0,0,0,0];for(const o in c)L[+o[0]-1]+=c[o];while(L.length&&!L[L.length-1])L.pop();return L;}
function fmtCfg(c){const s=LAYOUT.filter(o=>c[o]).map(o=>o+sup(c[o])).join('');return s||'—';}
function label(t){return EL[t.z][0]+(t.q?sup((Math.abs(t.q)>1?Math.abs(t.q):'')+(t.q>0?'+':'-')):'');}
function labelHTML(t){const q=t.q?'<sup>'+(Math.abs(t.q)>1?Math.abs(t.q):'')+(t.q>0?'+':'−')+'</sup>':'';return EL[t.z][0]+q;}
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const at=z=>({z,q:0}), io=(z,q)=>({z,q});

const POOLS={
 layers:{
  1:range(1,18).map(at),
  2:[io(1,-1),io(3,1),io(4,2),io(7,-3),io(8,-2),io(9,-1),io(11,1),io(12,2),io(13,3),io(15,-3),io(16,-2),io(17,-1)]},
 config:{
  1:range(1,18).map(at),
  2:[19,20,31,32,33,34,35,36].map(at).concat([io(11,1),io(17,-1),io(16,-2),io(8,-2),io(12,2),io(19,1),io(20,2),io(13,3),io(7,-3),io(9,-1)]),
  3:range(21,30).map(at).concat([io(26,2),io(26,3),io(29,2),io(29,1),io(30,2),io(25,2),io(24,3),io(35,-1),io(34,-2)])}
};
const MUST={layers:[],config:[24,29]};
const LVL=MODE==='layers'?{1:'лёгкий',2:'сложный'}:{1:'лёгкий',2:'средний',3:'сложный'};
const LEVELS=MODE==='layers'?[1,2]:[1,2,3];

function explain(t){
  const c=t.q?ionCfg(t.z,t.q):atomCfg(t.z);const e=t.z-t.q;const L=layers(c);
  let s='';
  if(t.q) s+=EL[t.z][0]+': '+t.z+' e⁻, '+(t.q>0?'отдаёт '+t.q:'принимает '+(-t.q))+' → '+e+' e⁻. ';
  if(MODE==='layers'){
    s+=(t.q?'':'Z = '+t.z+', '+L.length+' '+(L.length===1?'слой':'слоя')+'. ')+(L.length>1?L.join(' + ')+' = '+e:'все '+e+' e⁻ на первом слое')+'.';
    if(t.z>=21&&t.z<=30) s+=' 3-й слой: '+['3s','3p','3d'].filter(o=>c[o]).map(o=>o+sup(c[o])).join('')+' = '+L[2]+'.';
  } else {
    s+='Всего '+e+' e⁻: '+ORDER.filter(o=>c[o]).map(o=>c[o]).join(' + ')+'.';
    if(!t.q&&t.z>=21&&t.z<=30) s+=' После 4s заполняется 3d.';
    if(t.z>=31) s+=' После 3d¹⁰ заполняется 4p.';
  }
  if(!t.q&&(t.z===24||t.z===29)) s+=' Провал электрона: '+(t.z===24?'3d⁵4s¹ вместо 3d⁴4s²':'3d¹⁰4s¹ вместо 3d⁹4s²')+' — так устойчивее.';
  if(t.q>0&&t.z>=21&&t.z<=30) s+=' У катионов d-элементов сначала уходят 4s-электроны.';
  return s;
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(level){
  let pool=shuffle(POOLS[MODE][level]);
  if(level===3){const must=pool.filter(t=>!t.q&&MUST[MODE].includes(t.z));pool=must.concat(pool.filter(t=>!must.includes(t)));
    if(MODE==='config'){const ions=pool.filter(t=>t.q),atoms=pool.filter(t=>!t.q);pool=atoms.filter(t=>MUST.config.includes(t.z)).concat(ions.slice(0,3),atoms.filter(t=>!MUST.config.includes(t.z)),ions.slice(3));}}
  return shuffle(pool.slice(0,COUNT));
}

const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;const inTG=!!(tg&&tg.initData);
if(tg){try{tg.ready();tg.expand();if(inTG&&tg.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>{location.href='index.html';});}}catch(e){}}
if(inTG){try{const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u)$('name').value=[u.first_name,u.last_name].filter(Boolean).join(' ');}catch(e){}}

let tasks=[],cur=0,answered=false,log=[],t0=0,student='';

function start(){
  const name=$('name').value.trim();
  if(name.length<2){$('nameErr').textContent='Впиши имя, чтобы оно было на скриншоте';return;}
  student=name;$('nameErr').textContent='';
  tasks=[];LEVELS.forEach(l=>pick(l).forEach(t=>tasks.push({...t,l})));
  cur=0;log=[];t0=Date.now();
  $('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');show();
}

function cellsHTML(){
  if(MODE==='layers'){
    let h='<div class="scheme"><span class="nuc" id="nuc"></span>';
    for(let i=0;i<4;i++)h+='<span class="shell"><span class="arc"></span><input class="cell" inputmode="numeric" maxlength="2" data-i="'+i+'" aria-label="слой '+(i+1)+'"></span>';
    return h+'</div>';
  }
  let h='<div class="subs">';
  ORDER.forEach((o,i)=>{h+='<div class="sub"><span>'+o+'</span><input class="cell" inputmode="numeric" maxlength="2" data-i="'+i+'" aria-label="'+o+'"><em>до '+CAP[o[1]]+'</em></div>';});
  return h+'</div><div class="order">Подуровни стоят в порядке заполнения</div><div class="preview" id="preview"></div>';
}
function cells(){return [...document.querySelectorAll('#work .cell')];}
function readVals(){return cells().map(c=>{const v=c.value.trim();return v===''?0:parseInt(v,10);});}
function updPreview(){if(MODE!=='config')return;const v=readVals();const c={};ORDER.forEach((o,i)=>{if(v[i])c[o]=v[i];});$('preview').textContent=Object.keys(c).length?fmtCfg(c):'';}

function show(){
  const t=tasks[cur];answered=false;
  $('num').textContent='Задание '+(cur+1)+' из '+tasks.length;$('lvl').textContent=LVL[t.l];
  $('bar').style.width=(cur/tasks.length*100)+'%';
  $('qtext').textContent=MODE==='layers'
    ?(t.q?'Распредели электроны иона по слоям':'Распредели электроны атома по слоям')
    :(t.q?'Составь электронную формулу иона':'Составь электронную формулу атома');
  $('sym').innerHTML=labelHTML(t);
  $('ename').textContent=EL[t.z][1]+(t.q?(t.q>0?' (катион)':' (анион)'):'');
  $('ez').textContent='порядковый номер '+t.z;
  $('work').innerHTML=cellsHTML();
  if(MODE==='layers')$('nuc').textContent='+'+t.z;
  cells().forEach((c,i,all)=>{c.addEventListener('input',()=>{c.value=c.value.replace(/\D/g,'');updPreview();});
    c.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&all[i+1])all[i+1].focus();if(e.key==='ArrowLeft'&&all[i-1])all[i-1].focus();});});
  $('fb').className='fb';$('check').classList.remove('hidden');$('next').classList.add('hidden');
  cells()[0].focus();
}

function check(){
  if(answered)return;
  const t=tasks[cur];const c=t.q?ionCfg(t.z,t.q):atomCfg(t.z);const v=readVals();
  let right, user, correctStr;
  if(MODE==='layers'){
    const L=layers(c);const exp=[0,1,2,3].map(i=>L[i]||0);
    right=exp.every((x,i)=>x===v[i]);
    cells().forEach((el,i)=>{el.disabled=true;el.classList.add(exp[i]===v[i]?'right':'wrong');if(exp[i]!==v[i])el.title='верно: '+exp[i];});
    const uv=v.slice();while(uv.length&&!uv[uv.length-1])uv.pop();
    user=uv.join(', ')||'—';correctStr=L.join(', ');
  } else {
    const exp=ORDER.map(o=>c[o]||0);right=exp.every((x,i)=>x===v[i]);
    cells().forEach((el,i)=>{el.disabled=true;el.classList.add(exp[i]===v[i]?'right':'wrong');});
    const uc={};ORDER.forEach((o,i)=>{if(v[i])uc[o]=v[i];});user=fmtCfg(uc);correctStr=fmtCfg(c);
  }
  answered=true;log.push({t,ok:right,user,correct:correctStr});
  const fb=$('fb');fb.className='fb '+(right?'ok':'bad');
  fb.innerHTML='<b class="h">'+(right?'Верно!':'Неверно. Правильно: '+correctStr)+'</b>'+explain(t);
  $('check').classList.add('hidden');$('next').classList.remove('hidden');
  $('next').textContent=cur===tasks.length-1?'Посмотреть результат':'Дальше';$('next').focus();
}
function next(){if(!answered)return;cur++;cur<tasks.length?show():finish();}

function finish(){
  const right=log.filter(x=>x.ok).length,n=log.length,sec=Math.round((Date.now()-t0)/1000);
  const d=new Date(),pad=x=>String(x).padStart(2,'0');
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
  $('rName').textContent=student;
  $('rMeta').textContent=pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+', '+pad(d.getHours())+':'+pad(d.getMinutes())+' · время: '+Math.floor(sec/60)+' мин '+pad(sec%60)+' с';
  $('rScore').innerHTML=right+'<small>/'+n+'</small>';
  const p=Math.round(right/n*100);
  $('rVerdict').textContent=p===100?'Идеально!':p>=90?'Отлично!':p>=75?'Хорошо':p>=50?'Нужно потренироваться':'Повтори правила и попробуй снова';
  $('rPct').textContent=p+'% правильных ответов';
  $('rGrid').innerHTML=log.map((x,i)=>'<div class="'+(x.ok?'g':'r')+'">'+(i+1)+'</div>').join('');
  const bad=log.map((x,i)=>({...x,i})).filter(x=>!x.ok);
  $('rMist').innerHTML=bad.length===0?'<div class="perfect">Ни одной ошибки</div>':
    '<h3>Ошибки</h3><table><tr><th>№</th><th>Частица</th><th>Ответ</th><th>Верно</th></tr>'+
    bad.map(x=>'<tr><td>'+(x.i+1)+'</td><td><b>'+labelHTML(x.t)+'</b></td><td class="no">'+x.user+'</td><td class="yes">'+x.correct+'</td></tr>').join('')+'</table>';
  window.scrollTo(0,0);
}


$('check').onclick=check;$('next').onclick=next;

document.addEventListener('keydown',e=>{if($('quiz').classList.contains('hidden')||e.key!=='Enter')return;e.preventDefault();answered?next():check();});

/* ---- выбор уровня ---- */
const COUNT=12;
const LEVEL_INFO={"1": ["Лёгкий", "Атомы элементов 1–3 периодов"], "2": ["Сложный", "Ионы элементов 1–3 периодов"]};
let curLevel=1;
function start(level){
  curLevel=level;student='Уровень: '+LEVEL_INFO[level][0].toLowerCase();
  tasks=pick(level).map(t=>({...t,l:level}));cur=0;log=[];t0=Date.now();
  $('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');window.scrollTo(0,0);show();
}
$('levels').innerHTML=Object.entries(LEVEL_INFO).map(([k,v],i)=>'<button class="lv-btn" type="button" data-l="'+k+'"><span class="dot">'+(i+1)+'</span><span><b>'+v[0]+'</b><small>'+v[1]+'</small></span></button>').join('');
document.querySelectorAll('.lv-btn').forEach(b=>b.onclick=()=>start(+b.dataset.l));
$('againLvl').onclick=()=>start(curLevel);
$('toLevels').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('start').classList.remove('hidden');window.scrollTo(0,0);};
</script>
