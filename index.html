<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёры по химии</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--pu:#8153EC;--pu-d:#6a3fd6;--lv:#EFEAFF;--lv2:#E3DAFF;--ln:#D9CCFF;--ink:#1d1b26;--grey:#737373;--bg:#f7f5ff;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-weight:500}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-family:Unbounded,Montserrat,sans-serif;font-weight:600;color:var(--pu);font-size:26px;margin:0}
.head span{color:#be9fff;font-size:15px}
.line{height:3px;width:220px;border-radius:2px;background:linear-gradient(90deg,var(--pu),#c553ec);margin-bottom:18px}
.hello{margin:0 0 22px;color:var(--grey);line-height:1.5}
.group{margin-bottom:26px}
.group h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin:0 0 10px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:16px 18px;text-decoration:none;color:inherit;box-shadow:0 2px 0 var(--ln),0 8px 24px rgba(129,83,236,.07);transition:transform .12s,box-shadow .12s}
a.item:hover{transform:translateY(-1px);box-shadow:0 2px 0 var(--pu),0 10px 28px rgba(129,83,236,.14)}
a.item:focus-visible{outline:3px solid var(--pu);outline-offset:2px}
.icon{flex:none;width:52px;height:52px;border-radius:14px;background:var(--lv);border:1.5px solid var(--pu);box-shadow:3px -2px 0 var(--lv2);display:grid;place-items:center;font-family:Unbounded,Montserrat,sans-serif;font-size:14px;color:var(--pu)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;margin-bottom:3px}
.txt small{color:var(--grey);font-size:13px;line-height:1.4;display:block}
.go{flex:none;font-weight:700;color:#fff;background:var(--pu);border-radius:10px;padding:9px 14px;font-size:14px}
.item.soon{opacity:.6;box-shadow:0 2px 0 var(--ln)}
.item.soon .go{background:var(--lv);color:var(--pu)}
.foot{font-size:12px;color:var(--grey);margin-top:28px}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:7px;font-size:12px;color:var(--grey)}
.prog i{font-style:normal;font-weight:700;border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums;background:#f1f1f4;color:#aaa}
.prog i.c3{background:#e3f6ee;color:#1f9d6b}.prog i.c2{background:#fff2dc;color:#c27a00}.prog i.c1{background:#fde8eb;color:#e0475b}
@media (max-width:480px){.go{display:none}.item{padding:14px}}
@media (prefers-reduced-motion:reduce){.item{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>Тренажёры</h1><span>химия · ЕГЭ и ОГЭ</span></div>
  <div class="line"></div>
  <p class="hello" id="hello">Выбери тренажёр и отрабатывай теорию для ЕГЭ и ОГЭ в удобном формате.</p>
  <div id="menu"></div>
  <div class="foot">Если тренажёр не открывается — закрой и снова открой бота.</div>
</div>
<script>
/* Меню берётся из menu.json — того же файла, что и для кнопок в боте. */
const FALLBACK = { exams: [ { title: 'ЕГЭ', tasks: [ { title: 'Задание №3', trainers: [ { file: 'so.html', icon: 'С.О.', title: 'Степени окисления', about: '30 заданий: простые, средние, сложные · с разбором' } ] } ] } ] };

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); if (tg.BackButton) tg.BackButton.hide(); } catch (e) {} }
try {
  const u = tg && tg.initData && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u && u.first_name) document.getElementById('hello').textContent =
    'Привет, ' + u.first_name + '! Выбери тренажёр и отрабатывай теорию для ЕГЭ и ОГЭ в удобном формате.';
} catch (e) {}

const API = (() => { let a = null; try { a = new URLSearchParams(location.search).get('api'); if (a) sessionStorage.setItem('api', a); else a = sessionStorage.getItem('api'); } catch (e) {} return a; })();
let MENU = null, ROWS = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// лучший результат по каждому уровню (если открыто из бота)
function prog(it) {
  if (!ROWS) return '';
  const n = it.levels || 3, best = {};
  ROWS.filter(r => r.file === it.file).forEach(r => { const b = best[r.level]; if (!b || r.score / r.total > b.score / b.total) best[r.level] = r; });
  if (!Object.keys(best).length) return '<div class="prog">ещё не проходил(а)</div>';
  let done = 0, cells = '';
  for (let l = 1; l <= n; l++) {
    const b = best[l];
    if (!b) { cells += '<i title="' + esc((it.levelNames && it.levelNames[l - 1]) || 'уровень ' + l) + '">—</i>'; continue; }
    const p = b.score * 100 / b.total; if (p >= 70) done++;
    cells += '<i class="' + (p >= 85 ? 'c3' : p >= 60 ? 'c2' : 'c1') + '" title="' + esc((it.levelNames && it.levelNames[l - 1]) || 'уровень ' + l) + '">' + b.score + '/' + b.total + '</i>';
  }
  return '<div class="prog">пройдено ' + done + ' из ' + n + ': ' + cells + '</div>';
}
function card(it) {
  return !it.file
    ? '<div class="item soon"><div class="icon">' + esc(it.icon || '…') + '</div><div class="txt"><b>' + esc(it.title) + '</b><small>' + esc(it.about || 'Скоро') + '</small></div><span class="go">скоро</span></div>'
    : '<a class="item" href="' + esc(it.file) + (API ? '?api=' + encodeURIComponent(API) : '') + '"><div class="icon">' + esc(it.icon || '→') + '</div><div class="txt"><b>' + esc(it.title) + '</b><small>' + esc(it.about || '') + '</small>' + prog(it) + '</div><span class="go">Начать</span></a>';
}
function render(menu) {
  let html = '';
  (menu.exams || []).forEach(ex => (ex.tasks || []).forEach(t => {
    if (!(t.trainers || []).length) return;
    html += '<section class="group"><h2>' + esc(ex.title) + ' · ' + esc(t.title) + (t.subtitle ? ' · ' + esc(t.subtitle) : '') + '</h2><div class="list">' + t.trainers.map(card).join('') + '</div></section>';
  }));
  document.getElementById('menu').innerHTML = html;
}
fetch('menu.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(m => { MENU = m && m.exams ? m : FALLBACK; render(MENU); }).catch(() => { MENU = FALLBACK; render(MENU); });
if (API && tg && tg.initData) {
  fetch(API.replace(/\/$/, '') + '/api/me', { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify({ initData: tg.initData }) })
    .then(r => r.json()).then(d => { if (d.ok) { ROWS = d.rows || []; if (MENU) render(MENU); } }).catch(() => {});
}
</script>
</body>
</html>
