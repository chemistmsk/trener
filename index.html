<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёры по химии</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--pu:#8153EC;--pu-d:#6a3fd6;--lv:#EFEAFF;--lv2:#E3DAFF;--ln:#D9CCFF;--ink:#1d1b26;--grey:#737373;--bg:#f7f5ff;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-weight:500}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-family:Unbounded,Montserrat,sans-serif;font-weight:600;color:var(--pu);font-size:26px;margin:0}
.head span{color:#be9fff;font-size:15px}
.line{height:3px;width:220px;border-radius:2px;background:linear-gradient(90deg,var(--pu),#c553ec);margin-bottom:18px}
.hello{margin:0 0 22px;color:var(--grey);line-height:1.5}
.group{margin-bottom:26px}
.group h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin:0 0 10px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:16px 18px;text-decoration:none;color:inherit;box-shadow:0 2px 0 var(--ln),0 8px 24px rgba(129,83,236,.07);transition:transform .12s,box-shadow .12s}
a.item:hover{transform:translateY(-1px);box-shadow:0 2px 0 var(--pu),0 10px 28px rgba(129,83,236,.14)}
a.item:focus-visible{outline:3px solid var(--pu);outline-offset:2px}
.icon{flex:none;width:52px;height:52px;border-radius:14px;background:var(--lv);border:1.5px solid var(--pu);box-shadow:3px -2px 0 var(--lv2);display:grid;place-items:center;font-family:Unbounded,Montserrat,sans-serif;font-size:14px;color:var(--pu)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;margin-bottom:3px}
.txt small{color:var(--grey);font-size:13px;line-height:1.4;display:block}
.go{flex:none;font-weight:700;color:#fff;background:var(--pu);border-radius:10px;padding:9px 14px;font-size:14px}
.item.soon{opacity:.6;box-shadow:0 2px 0 var(--ln)}
.item.soon .go{background:var(--lv);color:var(--pu)}
.foot{font-size:12px;color:var(--grey);margin-top:28px}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:7px;font-size:12px;color:var(--grey)}
.prog i{font-style:normal;font-weight:700;border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums;background:#f1f1f4;color:#aaa}
.prog i.c3{background:#e3f6ee;color:#1f9d6b}.prog i.c2{background:#fff2dc;color:#c27a00}.prog i.c1{background:#fde8eb;color:#e0475b}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;min-width:0;font:inherit;font-weight:700;font-size:15px;border:1.5px solid var(--ln);border-radius:20px;padding:9px 6px;background:#fff;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--pu);border-color:var(--pu);color:#fff}
.chips{display:flex;gap:6px;margin-bottom:18px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:1;min-width:0;font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--ln);border-radius:20px;padding:8px 4px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.chips button.on{border-color:var(--pu);background:var(--lv);color:var(--pu)}
.group h2 small{display:block;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;margin-top:2px}
.empty{color:var(--grey);text-align:center;padding:30px 0}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:0;border-radius:16px;padding:12px 14px;box-shadow:0 2px 0 var(--ln),0 8px 24px rgba(129,83,236,.07);cursor:pointer}
.trow:hover{box-shadow:0 2px 0 var(--pu),0 10px 28px rgba(129,83,236,.14)}
.trow .tn{flex:none;width:48px;height:48px;border-radius:13px;background:var(--lv);border:1.5px solid var(--pu);display:grid;place-items:center;font-family:Unbounded,Montserrat,sans-serif;font-size:13px;color:var(--pu);overflow:hidden}
.trow .tt{flex:1;min-width:0}.trow .tt b{display:block;font-size:15.5px;line-height:1.3}.trow .tt small{display:block;font-size:12.5px;color:var(--grey);margin-top:3px}
.pbar{display:block;height:6px;border-radius:4px;background:#ece8f8;margin-top:7px;overflow:hidden}.pbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pu),#c553ec);transition:width .4s}
.trow .ta{flex:none;color:var(--pu);font-size:24px;font-weight:700;line-height:1}
.trow.soon{opacity:.55;cursor:default;box-shadow:0 2px 0 var(--ln)}
.backl{font:inherit;font-weight:600;color:var(--pu);background:none;border:0;padding:0;margin:0 0 14px;cursor:pointer;font-size:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--grey);font-weight:600;font-size:12px;padding:6px 0;border-radius:12px}
.tabs a b{font-size:20px;line-height:1}
.tabs a.on{color:var(--pu);background:var(--lv)}
body{padding-bottom:76px}
@media (max-width:480px){.go{display:none}.item{padding:14px}}
@media (prefers-reduced-motion:reduce){.item{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>Тренажёры</h1><span>химия · ЕГЭ и ОГЭ</span></div>
  <div class="line"></div>
  <p class="hello" id="hello">Выбери тренажёр и отрабатывай теорию для ЕГЭ и ОГЭ в удобном формате.</p>
  <div class="seg" id="exams"></div>
  <div class="chips" id="secs"></div>
  <div id="menu"></div>
  <div class="foot">Если тренажёр не открывается — закрой и снова открой бота.</div>
</div>
<nav class="tabs" id="tabs"><a class="on" href="#"><b>📚</b>Тренажёры</a><a id="tabMe" href="me.html"><b>📈</b>Мой прогресс</a></nav>
<script>
/* Меню берётся из menu.json — того же файла, что и для кнопок в боте. */
const FALLBACK = { exams: [ { id: 'ege', title: 'ЕГЭ', tasks: [ { title: '№3', trainers: [ { file: 'so.html', icon: 'С.О.', title: 'Степени окисления', about: '30 заданий: простые, средние, сложные · с разбором' } ] } ] } ] };

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); if (tg.BackButton) tg.BackButton.hide(); } catch (e) {} }
try {
  const u = tg && tg.initData && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u && u.first_name) document.getElementById('hello').textContent =
    'Привет, ' + u.first_name + '! Выбери тренажёр и отрабатывай теорию для ЕГЭ и ОГЭ в удобном формате.';
} catch (e) {}

const API = (() => { let a = null; try { a = new URLSearchParams(location.search).get('api'); if (a) sessionStorage.setItem('api', a); else a = sessionStorage.getItem('api'); } catch (e) {} return a; })();
let MENU = null, ROWS = null;
if (API) document.getElementById('tabMe').href = 'me.html?api=' + encodeURIComponent(API);
document.getElementById('tabMe').onclick = e => { e.preventDefault(); location.replace(document.getElementById('tabMe').href); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// лучший результат по каждому уровню (если открыто из бота)
function prog(it) {
  if (!ROWS) return '';
  const n = it.levels || 3, best = {};
  ROWS.filter(r => r.file === it.file).forEach(r => { const b = best[r.level]; if (!b || r.score / r.total > b.score / b.total) best[r.level] = r; });
  if (!Object.keys(best).length) return '<div class="prog">ещё не проходил(а)</div>';
  let done = 0, cells = '';
  for (let l = 1; l <= n; l++) {
    const b = best[l];
    if (!b) { cells += '<i title="' + esc((it.levelNames && it.levelNames[l - 1]) || 'уровень ' + l) + '">—</i>'; continue; }
    const p = b.score * 100 / b.total; if (p >= 70) done++;
    cells += '<i class="' + (p >= 85 ? 'c3' : p >= 60 ? 'c2' : 'c1') + '" title="' + esc((it.levelNames && it.levelNames[l - 1]) || 'уровень ' + l) + '">' + b.score + '/' + b.total + '</i>';
  }
  return '<div class="prog">пройдено ' + done + ' из ' + n + ': ' + cells + '</div>';
}
function card(it) {
  return !it.file
    ? '<div class="item soon"><div class="icon">' + esc(it.icon || '…') + '</div><div class="txt"><b>' + esc(it.title) + '</b><small>' + esc(it.about || 'Скоро') + '</small></div><span class="go">скоро</span></div>'
    : '<a class="item" href="' + esc(it.file) + (API ? '?api=' + encodeURIComponent(API) : '') + '"><div class="icon">' + esc(it.icon || '→') + '</div><div class="txt"><b>' + esc(it.title) + '</b><small>' + esc(it.about || '') + '</small>' + prog(it) + '</div><span class="go">Начать</span></a>';
}
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v);}catch(e){}return null;};
let curEx=ss('ex')||'ege', curSec=ss('sec');
let curTopic=ss('topic')||'';
function passed(t){
  let d=0,n=0;
  (t.trainers||[]).filter(x=>x.file).forEach(x=>{const L=x.levels||3;n+=L;
    if(!ROWS)return;for(let l=1;l<=L;l++){if(ROWS.some(r=>r.file===x.file&&r.level===l&&r.score*100/r.total>=70))d++;}});
  return {d,n};
}
function row(t){
  const has=(t.trainers||[]).some(x=>x.file);const num=/^№/.test(t.title);
  const name=num?(t.subtitle||t.title):t.title;
  const badge=num?t.title:(t.icon||((t.trainers||[])[0]&&t.trainers[0].icon)||t.title.slice(0,2));
  let sub;
  if(!has)sub='скоро';
  let bar='';
  if(has){const p=passed(t);sub=ROWS?'пройдено '+p.d+' из '+p.n+' уровней':'';
    if(ROWS)bar='<span class="pbar"><i style="width:'+(p.n?Math.round(p.d*100/p.n):0)+'%"></i></span>';}
  return '<button type="button" class="trow'+(has?'':' soon')+'" data-t="'+esc(t.id)+'"><span class="tn">'+esc(badge)+'</span><span class="tt"><b>'+esc(name)+'</b>'+bar+(sub?'<small>'+esc(sub)+'</small>':'')+'</span><span class="ta">'+(has?'›':'')+'</span></button>';
}
function setBack(on){try{if(!tg||!tg.BackButton)return;if(on){tg.BackButton.show();}else tg.BackButton.hide();}catch(e){}}
function openTopic(id){curTopic=id;ss('topic',id);render(MENU);window.scrollTo(0,0);}
try{if(tg&&tg.BackButton)tg.BackButton.onClick(()=>openTopic(''));}catch(e){}
function render(menu) {
  const exams=(menu.exams||[]).slice().sort((a,b)=>(b.id==='ege')-(a.id==='ege'));
  let ex=exams.find(e=>e.id===curEx)||exams.find(e=>e.id==='ege')||exams[0];if(!ex)return;
  curEx=ex.id;ss('ex',curEx);
  document.getElementById('exams').innerHTML=exams.map(e=>'<button type="button" data-e="'+esc(e.id)+'" class="'+(e.id===ex.id?'on':'')+'">'+esc(e.title)+'</button>').join('');
  document.querySelectorAll('#exams button').forEach(b=>b.onclick=()=>{curEx=b.dataset.e;curTopic='';ss('topic','');render(MENU);});
  const secs=ex.sections||[];let tasks=ex.tasks||[];let sec=null;
  const secEl=document.getElementById('secs');
  if(secs.length){
    sec=secs.find(x=>x.id===curSec)||secs[0];curSec=sec.id;ss('sec',curSec);
    secEl.style.display='';secEl.innerHTML=secs.map(x=>'<button type="button" data-s="'+esc(x.id)+'" class="'+(x.id===sec.id?'on':'')+'">'+esc(x.short||x.title)+'</button>').join('');
    secEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{curSec=b.dataset.s;curTopic='';ss('topic','');render(MENU);});
    tasks=tasks.filter(t=>t.section===sec.id);
  } else secEl.style.display='none';
  const el=document.getElementById('menu');
  const topic=tasks.find(t=>String(t.id)===curTopic&&(t.trainers||[]).some(x=>x.file));
  if(topic){
    setBack(true);
    const num=/^№/.test(topic.title);
    el.innerHTML='<button type="button" class="backl" id="backl">← '+esc(sec?sec.title:ex.title)+'</button><section class="group"><h2>'+esc(num?topic.title+' · '+(topic.subtitle||''):topic.title)+(!num&&topic.subtitle?'<small>'+esc(topic.subtitle)+'</small>':'')+'</h2><div class="list">'+topic.trainers.map(card).join('')+'</div></section>';
    document.getElementById('backl').onclick=()=>openTopic('');
    return;
  }
  setBack(false);
  if(!tasks.some(t=>(t.trainers||[]).length)&&!secs.length){el.innerHTML='<div class="empty">Тренажёры для '+esc(ex.title)+' скоро появятся.</div>';return;}
  el.innerHTML='<div class="tlist">'+tasks.map(row).join('')+'</div>';
  el.querySelectorAll('.trow:not(.soon)').forEach(b=>b.onclick=()=>openTopic(b.dataset.t));
}
fetch('menu.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(m => { MENU = m && m.exams ? m : FALLBACK; render(MENU); }).catch(() => { MENU = FALLBACK; render(MENU); });
if (API && tg && tg.initData) {
  fetch(API.replace(/\/$/, '') + '/api/me', { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify({ initData: tg.initData }) })
    .then(r => r.json()).then(d => { if (d.ok) { ROWS = d.rows || []; if (MENU) render(MENU); } }).catch(() => {});
}
</script>
</body>
</html>
