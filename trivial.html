<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тривиальные названия</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>

:root{--pu:#8153EC;--pu-d:#6a3fd6;--lv:#EFEAFF;--lv2:#E3DAFF;--ln:#D9CCFF;--ink:#1d1b26;--grey:#737373;--ok:#1f9d6b;--ok-bg:#e3f6ee;--bad:#e0475b;--bad-bg:#fde8eb;--bg:#f7f5ff;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-weight:500}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
.back{display:inline-flex;gap:6px;color:var(--pu);font-weight:600;font-size:14px;text-decoration:none;margin-bottom:14px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-family:Unbounded,Montserrat,sans-serif;font-weight:600;color:var(--pu);font-size:24px;margin:0}
.head span{color:#be9fff;font-size:15px}
.line{height:3px;width:220px;border-radius:2px;background:linear-gradient(90deg,var(--pu),#c553ec);margin-bottom:22px}
.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 2px 0 var(--ln),0 10px 30px rgba(129,83,236,.08)}
.pill{display:inline-block;font-family:Unbounded,Montserrat,sans-serif;font-size:13px;color:var(--pu);background:var(--lv);border:1.5px solid var(--pu);border-radius:7px;padding:4px 10px;box-shadow:3px -2px 0 var(--lv2)}
label{display:block;font-weight:600;margin:18px 0 6px}
input.name{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;outline:none}
input.name:focus{border-color:var(--pu)}
.rules{margin:16px 0 0;padding-left:20px;line-height:1.6}
.rules b{color:var(--pu)}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;background:var(--pu);color:#fff}
.btn:hover{background:var(--pu-d)}
.btn.ghost{background:var(--lv);color:var(--pu)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:18px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--grey);margin-bottom:8px}
.bar{height:8px;background:var(--lv);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),#c553ec);width:0;transition:width .3s}
.lvl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--pu);background:var(--lv);padding:4px 9px;border-radius:20px}
.q{text-align:center;margin:4px 0 10px;color:var(--grey);font-size:15px}
.el{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0 20px}
.sym{font-size:44px;font-weight:700;color:var(--pu);background:var(--lv);border-radius:14px;padding:6px 16px;box-shadow:inset 0 -3px 0 var(--pu);line-height:1.2}
.sym sup{font-size:.45em}
.el small{display:block;color:var(--grey);font-size:14px}
.el b{font-size:18px}
/* layers */
.scheme{display:flex;align-items:flex-start;justify-content:center;gap:6px;font-weight:700}
.nuc{color:var(--pu);font-size:24px;height:84px;display:flex;align-items:center;margin-right:2px}
.shell{display:flex;flex-direction:column;align-items:center;gap:6px}
.arc{align-self:flex-start;width:23px;height:84px;border-right:3px solid var(--pu);border-radius:0 50% 50% 0 / 0 50% 50% 0;opacity:.55}
.shell .cell{width:46px;height:44px;font-size:20px}
.cell{width:56px;height:52px;text-align:center;font:700 22px Montserrat,sans-serif;border:1.5px solid var(--ln);border-radius:12px;outline:none;color:var(--ink);background:#fff}
.cell:focus{border-color:var(--pu)}
.cell.right{border-color:var(--ok);background:var(--ok-bg)}
.cell.wrong{border-color:var(--bad);background:var(--bad-bg)}
.lwrap{overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.ladder{--c:32px;display:grid;grid-template-columns:repeat(19,var(--c));grid-auto-rows:var(--c);width:max-content;margin:0 auto}
.ll{display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap}
.orb{width:var(--c);height:var(--c);border:0;outline:1.5px solid var(--pu);outline-offset:-.75px;background:#fff;font:700 16px Montserrat,sans-serif;color:var(--pu);cursor:pointer;padding:0;letter-spacing:-2px;display:grid;place-items:center}
.orb:hover{background:var(--lv)}
.orb .ar{height:80%;width:auto;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.orb .pair{display:flex;gap:1px;height:100%;align-items:center;justify-content:center}
.orb:focus-visible{outline:3px solid #c553ec;z-index:1}
.orb:disabled{cursor:default}
.orb.right{outline-color:var(--ok);background:var(--ok-bg);color:var(--ok);z-index:1}
.orb.wrong{outline-color:var(--bad);background:var(--bad-bg);color:var(--bad);z-index:2}
.ll.right{color:var(--ok)} .ll.wrong{color:var(--bad)}
.mini{--c:20px;margin-top:10px}
.mini .orb{font-size:11px;outline-color:var(--ok);color:var(--ok);background:#fff;letter-spacing:-1px}
.mini .ll{font-size:10px;padding-right:3px}
.swipe{display:none;font-size:12px;color:var(--grey);text-align:center}
@media (max-width:560px){.ladder{--c:26px}.orb{font-size:13px}.swipe{display:block}}
/* config */
.subs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sub{display:flex;flex-direction:column;align-items:center;gap:4px}
.sub span{font-weight:700;font-size:16px}
.sub em{font-style:normal;font-size:11px;color:var(--grey)}
.sub .cell{width:100%;max-width:58px;height:48px;font-size:20px}
.order{font-size:12px;color:var(--grey);text-align:center;margin-top:8px}
.preview{text-align:center;font-size:20px;font-weight:600;margin-top:14px;min-height:30px;letter-spacing:.3px}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;line-height:1.55;display:none}
.fb.ok{display:block;background:var(--ok-bg)} .fb.bad{display:block;background:var(--bad-bg)}
.fb b.h{display:block;margin-bottom:2px}
.fb.ok b.h{color:var(--ok)} .fb.bad b.h{color:var(--bad)}
.hint{font-size:13px;color:var(--grey);margin-top:12px;text-align:center}
.res-name{font-size:18px;font-weight:700}
.res-meta{color:var(--grey);font-size:14px;margin-top:4px}
.score{display:flex;align-items:center;gap:20px;margin:22px 0;flex-wrap:wrap}
.score .big{font-family:Unbounded,Montserrat,sans-serif;font-size:64px;color:var(--pu);line-height:1}
.score .big small{font-size:.45em;color:var(--grey)}
.score .verdict{font-size:18px;font-weight:700}
.score .pct{color:var(--grey);font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:20px}
.grid div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.grid .g{background:var(--ok)} .grid .r{background:var(--bad)}
.mist h3{font-size:15px;margin:0 0 8px;color:var(--pu)}
.mist table{width:100%;border-collapse:collapse;font-size:14px}
.mist td,.mist th{border:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top}
.mist td{overflow-wrap:anywhere}
.mist th{background:var(--lv);color:var(--pu)}
.mist .no{color:var(--bad);font-weight:600} .mist .yes{color:var(--ok);font-weight:600}
.perfect{background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:12px;padding:12px 16px}
.foot{font-size:12px;color:var(--grey);margin-top:16px}
.hidden{display:none}
@media (max-width:560px){
  .subs{grid-template-columns:repeat(4,1fr)}
  .card{padding:18px}
  .cell{width:48px;height:48px;font-size:20px}
  .score .big{font-size:52px}
  .grid{gap:4px}
}

.levels{display:grid;gap:10px;margin-top:16px}
.lv-btn{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--ln);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.lv-btn:hover{border-color:var(--pu)}
.lv-btn .dot{flex:none;width:40px;height:40px;border-radius:12px;background:var(--lv);color:var(--pu);display:grid;place-items:center;font-weight:700;font-size:16px}
.lv-btn b{display:block;font-size:17px}
.lv-btn small{display:block;color:var(--grey);font-size:13px;line-height:1.4;margin-top:2px}
.lv-note{color:var(--grey);font-size:13px;margin:14px 0 0}
.nm{text-align:center;font-size:24px;font-weight:700;color:var(--pu);background:var(--lv);border-radius:14px;padding:12px 16px;box-shadow:inset 0 -3px 0 var(--pu);margin:4px auto 16px;width:fit-content;max-width:100%}
.fin{display:block;width:100%;font:600 30px Montserrat,sans-serif;line-height:1.6;height:auto;min-height:72px;text-align:center;padding:8px 12px 14px;overflow:visible;border:1.5px solid var(--ln);border-radius:14px;outline:none;color:var(--ink);letter-spacing:.5px;background:#fff}
.fin:focus{border-color:var(--pu)}
.fin.right{border-color:var(--ok);background:var(--ok-bg)} .fin.wrong{border-color:var(--bad);background:var(--bad-bg)}
.kb{margin-top:12px;display:grid;gap:6px}
.kb .r{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.key{font:600 15px Montserrat,sans-serif;padding:9px 0;border-radius:9px;border:1px solid var(--ln);background:#fff;color:var(--ink);cursor:pointer;min-width:0}
.key:hover{border-color:var(--pu)}
.key.d{background:var(--lv);color:var(--pu)}
.key.w{grid-column:span 2;background:#f1edfb;font-size:13px}
.mist td{overflow-wrap:anywhere}
@media (max-width:400px){.key{font-size:14px;padding:8px 0}.fin{font-size:26px}.nm{font-size:20px}}
.fin.tx{font-size:22px;min-height:60px;line-height:1.4;padding:12px}
.sw{display:flex;align-items:center;gap:10px}.sw .fin{flex:1;min-width:0}.sw span{font-size:22px;font-weight:600;flex:none}.sw span:empty{display:none}
.fb .salt{display:block;color:var(--grey);font-size:14px;margin-top:4px}
.sec{font-weight:700;color:var(--pu);margin:20px 0 -4px;font-size:15px}
.nmt{font-size:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:600 18px Montserrat,sans-serif;padding:14px 8px;border-radius:14px;border:1.5px solid var(--ln);background:#fff;color:var(--ink);cursor:pointer;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.opt:hover{border-color:var(--pu)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@media (max-width:400px){.sw span,.fin.tx{font-size:19px}.opt{font-size:16px}}
.hidden{display:none!important}
</style>
</head>
<body>
<style>.key.w1{font-size:12px;background:#f1edfb}</style>
<div class="wrap">
  <a class="back" href="index.html">← Все тренажёры</a>
  <div class="head"><h1>Тривиальные названия</h1><span>тренажёр</span></div>
  <div class="line"></div>

  <section id="start" class="card">
    <span class="pill">Выбери уровень</span>
    <div class="levels" id="levels"></div>
    <p class="lv-note">В каждом уровне 15 вопросов: оксиды, гидроксиды, соли и другие вещества.</p>
  </section>

  <section id="quiz" class="card hidden">
    <div class="top"><span id="num"></span><span class="lvl" id="lvl"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="q" id="qt"></div>
    <div class="nm" id="nm"></div>
    <div class="opts hidden" id="opts"></div>
    <div id="typeBox" class="hidden">
      <input class="fin" id="fin" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Формула">
      <div class="kb" id="kb"></div>
    </div>
    <div class="err" id="qErr"></div>
    <div class="fb" id="fb"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="check">Проверить</button>
      <button class="btn hidden" id="next">Дальше</button>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <section id="result" class="card hidden">
    <span class="pill">Результат</span>
    <div style="margin-top:16px"><div class="res-name" id="rName"></div><div class="res-meta" id="rMeta"></div></div>
    <div class="score"><div class="big" id="rScore"></div><div><div class="verdict" id="rVerdict"></div><div class="pct" id="rPct"></div></div></div>
    <div class="grid" id="rGrid"></div>
    <div class="mist" id="rMist"></div>
    <div class="row"><button class="btn" id="againLvl">Ещё раз</button><button class="btn ghost" id="toLevels">Другой уровень</button></div>
  </section>
</div>

<script>
// f — формула (цифра сразу после · — коэффициент, остальные цифры — индексы); d — как показывать, если отличается;
// n — названия; alt — другие верные записи; noType — не спрашивать ввод формулы; trap — похожие вещества для неверных вариантов
const BANK=[
 {g:'ox',f:'Al2O3',n:['глинозём','корунд']},
 {g:'ox',f:'CaO',n:['негашёная известь'],trap:['Ca(OH)2','CaCO3']},
 {g:'ox',f:'CO',n:['угарный газ'],trap:['CO2']},
 {g:'ox',f:'CO2',n:['углекислый газ'],trap:['CO']},
 {g:'ox',f:'Fe3O4',n:['железная окалина'],alt:['FeO·Fe2O3'],trap:['FeS2']},
 {g:'ox',f:'H2O',n:['вода','лёд','водяной пар'],trap:['H2O2']},
 {g:'ox',f:'N2O',n:['веселящий газ'],trap:['NO2']},
 {g:'ox',f:'NO2',n:['бурый газ'],trap:['N2O']},
 {g:'ox',f:'SiO2',n:['песок','кварц','кремнезём'],trap:['SiC','SiH4']},
 {g:'ox',f:'SO2',n:['сернистый газ'],trap:['SO3']},
 {g:'ox',f:'SO3',n:['серный ангидрид'],trap:['SO2']},
 {g:'hy',f:'Ca(OH)2',n:['гашёная известь'],trap:['CaO','CaCO3']},
 {g:'hy',f:'KOH',n:['едкое кали'],trap:['NaOH','K2CO3']},
 {g:'hy',f:'NaOH',n:['едкий натр','каустическая сода'],trap:['KOH','Na2CO3','NaHCO3']},
 {g:'hy',f:'NH3·H2O',n:['нашатырный спирт','раствор аммиака'],alt:['NH4OH','H2O·NH3'],trap:['NH3','NH4Cl']},
 {g:'sa',f:'NaCl',n:['поваренная соль'],trap:['NH4Cl','KClO3']},
 {g:'sa',f:'NH4Cl',n:['нашатырь'],trap:['NH3·H2O','NaCl']},
 {g:'sa',f:'KNO3',n:['калийная селитра'],trap:['NaNO3','NH4NO3']},
 {g:'sa',f:'NaNO3',n:['натриевая селитра'],trap:['KNO3','NH4NO3']},
 {g:'sa',f:'NH4NO3',n:['аммиачная селитра'],trap:['KNO3','NaNO3','NH4Cl']},
 {g:'sa',f:'K2CO3',n:['поташ'],trap:['KOH','Na2CO3']},
 {g:'sa',f:'Na2CO3',n:['кальцинированная сода'],trap:['NaHCO3','Na2CO3·10H2O','NaOH']},
 {g:'sa',f:'NaHCO3',n:['пищевая сода','питьевая сода'],trap:['Na2CO3','Na2CO3·10H2O','NaOH']},
 {g:'sa',f:'CaCO3',n:['мел','мрамор','известняк'],trap:['CaO','Ca(OH)2','Ca3(PO4)2']},
 {g:'sa',f:'Ca3(PO4)2',n:['апатит'],trap:['CaCO3','CaSO4·2H2O']},
 {g:'sa',f:'KClO3',n:['бертолетова соль'],trap:['NaCl','KNO3']},
 {g:'sa',f:'FeS2',n:['пирит','железный колчедан','серный колчедан'],trap:['Fe3O4','FeSO4·7H2O']},
 {g:'sa',f:'(CuOH)2CO3',n:['малахит'],alt:['Cu2(OH)2CO3','Cu2CO3(OH)2'],trap:['CuSO4·5H2O']},
 {g:'sa',f:'Na2CO3·10H2O',n:['кристаллическая сода'],trap:['Na2CO3','Na2SO4·10H2O','NaHCO3']},
 {g:'sa',f:'CuSO4·5H2O',n:['медный купорос'],trap:['FeSO4·7H2O','(CuOH)2CO3']},
 {g:'sa',f:'FeSO4·7H2O',n:['железный купорос'],trap:['CuSO4·5H2O','FeS2']},
 {g:'sa',f:'Na2SO4·10H2O',n:['глауберова соль'],trap:['Na2CO3·10H2O','CaSO4·2H2O']},
 {g:'sa',f:'CaSO4·2H2O',n:['гипс'],trap:['CaCO3','Na2SO4·10H2O']},
 {g:'sa',f:'Na3[AlF6]',n:['криолит'],alt:['Na3AlF6'],trap:['Al2O3']},
 {g:'ot',f:'O3',n:['озон'],trap:['H2O2']},
 {g:'ot',f:'P4',n:['белый фосфор'],trap:['P','PH3']},
 {g:'ot',f:'P',n:['красный фосфор'],alt:['Pn'],trap:['P4','PH3']},
 {g:'ot',f:'Br2',d:'Br2 (р-р)',n:['бромная вода'],trap:['Cl2']},
 {g:'ot',f:'Cl2',d:'Cl2 (р-р)',n:['хлорная вода'],trap:['Br2']},
 {g:'ot',f:'C',n:['кокс','уголь','графит','алмаз'],trap:['SiC']},
 {g:'ot',f:'S8',n:['ромбическая сера'],alt:['S'],trap:['SO2']},
 {g:'ot',f:'H2O2',n:['пероксид водорода'],trap:['H2O','O3']},
 {g:'ot',f:'NH3',n:['аммиак'],trap:['PH3','NH3·H2O']},
 {g:'ot',f:'PH3',n:['фосфин'],trap:['NH3','SiH4']},
 {g:'ot',f:'SiH4',n:['силан'],trap:['PH3','SiC']},
 {g:'ot',f:'SiC',n:['карборунд'],trap:['SiO2','SiH4']},
 {g:'ot',f:'SO3 в H2SO4',d:'SO3 в H2SO4 (конц.)',n:['олеум'],noType:true,trap:['SO3','SO2']},
];
const BY={};BANK.forEach(x=>BY[x.f]=x);
const LEVEL_INFO={1:['Лёгкий','По названию выбери формулу'],2:['Средний','По формуле выбери название'],3:['Сложный','По названию напиши формулу — как на ЕГЭ']};
const LVL={1:'лёгкий',2:'средний',3:'сложный'};
const COUNT=15;
const SUB='₀₁₂₃₄₅₆₇₈₉';
// цифры после «·» — коэффициент (обычные), остальные — индексы
const toSub=s=>s.replace(/(·)?(\d+)/g,(m,dot,d)=>dot?m:d.replace(/\d/g,c=>SUB[+c]));
const show_f=x=>toSub(x.d||x.f);
const CYR={'А':'A','В':'B','С':'C','Е':'E','Н':'H','К':'K','М':'M','О':'O','Р':'P','Т':'T','Х':'X','а':'a','с':'c','е':'e','о':'o','р':'p','х':'x','у':'y'};
const norm=s=>s.replace(/[АВСЕНКМОРТХасеорху]/g,c=>CYR[c]).replace(/[₀-₉]/g,c=>SUB.indexOf(c)).replace(/[\s·*.]/g,'');
const KEYS=[['H','O','N','C','S','P','Cl','F'],['Na','K','Ca','Fe','Cu','Al','Si','Br'],['(',')','[',']','·','1','0','⌫'],['2','3','4','5','6','7','8','сброс']];
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const allNames=x=>x.n.join(', ');
const tg=window.Telegram&&window.Telegram.WebApp;const inTG=!!(tg&&tg.initData);
if(tg){try{tg.ready();tg.expand();if(inTG&&tg.BackButton){tg.BackButton.show();tg.BackButton.onClick(()=>{location.href='index.html';});}}catch(e){}}

$('kb').innerHTML=KEYS.map(r=>'<div class="r">'+r.map(k=>'<button class="key'+(/^\d$/.test(k)?' d':'')+(k==='сброс'?' w1':'')+'" type="button" data-k="'+k+'">'+k+'</button>').join('')+'</div>').join('');
const fin=$('fin');
function insert(t){
  const a=fin.selectionStart??fin.value.length,b=fin.selectionEnd??fin.value.length;
  fin.value=fin.value.slice(0,a)+t+fin.value.slice(b);const p=a+t.length;fin.setSelectionRange(p,p);fixSub();
}
// пересчитать индексы во всей строке (после «·» цифра — коэффициент)
function fixSub(){const p=fin.selectionStart;const raw=fin.value.replace(/[₀-₉]/g,c=>SUB.indexOf(c)).replace(/[*]/g,'·');fin.value=toSub(raw);try{fin.setSelectionRange(p,p);}catch(e){}}
document.querySelectorAll('.key').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{if(answered)return;const k=b.dataset.k;
  if(k==='⌫'){const a=fin.selectionStart??fin.value.length,e=fin.selectionEnd??a;if(a!==e)insert('');else if(a>0){fin.value=fin.value.slice(0,a-1)+fin.value.slice(a);fin.setSelectionRange(a-1,a-1);fixSub();}}
  else if(k==='сброс')fin.value='';
  else insert(k);
  $('qErr').textContent='';});
fin.addEventListener('input',()=>{fixSub();$('qErr').textContent='';});

// неверные варианты: сначала «ловушки», потом вещества той же группы, потом любые
function distractors(x){
  const out=[];const add=y=>{if(y&&y!==x&&!out.includes(y)&&out.length<3)out.push(y);};
  shuffle((x.trap||[]).map(f=>BY[f])).forEach(add);
  shuffle(BANK.filter(y=>y.g===x.g)).forEach(add);
  shuffle(BANK).forEach(add);
  return out;
}
let tasks=[],cur=0,answered=false,log=[],t0=0,curLevel=1,sel=null;
function start(level){
  curLevel=level;
  const pool=level===3?BANK.filter(x=>!x.noType):BANK;
  tasks=shuffle(pool).slice(0,COUNT).map(x=>{
    const name=pick(x.n);
    const t={x,name,l:level};
    if(level===1)t.opts=shuffle([x,...distractors(x)]).map(y=>({y,label:show_f(y)}));
    if(level===2)t.opts=shuffle([x,...distractors(x)]).map(y=>({y,label:y===x?name:pick(y.n)}));
    return t;});
  cur=0;log=[];t0=Date.now();
  $('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');window.scrollTo(0,0);show();
}
function show(){
  const t=tasks[cur];answered=false;sel=null;
  $('num').textContent='Задание '+(cur+1)+' из '+tasks.length;$('lvl').textContent=LVL[t.l];
  $('bar').style.width=(cur/tasks.length*100)+'%';
  $('qErr').textContent='';$('fb').className='fb';$('check').classList.remove('hidden');$('next').classList.add('hidden');
  const typing=t.l===3;
  $('typeBox').classList.toggle('hidden',!typing);$('opts').classList.toggle('hidden',typing);
  $('check').classList.toggle('hidden',!typing);
  if(t.l===2){$('qt').textContent='Как называется это вещество?';$('nm').textContent=show_f(t.x);$('nm').className='nm';}
  else{$('qt').textContent=t.l===1?'Выбери формулу вещества':'Напиши формулу вещества';$('nm').textContent=cap(t.name);$('nm').className='nm nmt';}
  $('hint').textContent=typing?'Цифра после «·» — коэффициент, остальные цифры — индексы · Enter — проверить / дальше':'Нажми на правильный вариант';
  if(typing){fin.value='';fin.className='fin';fin.readOnly=false;if(!('ontouchstart' in window))fin.focus();}
  else{$('opts').innerHTML=t.opts.map((o,i)=>'<button class="opt" type="button" data-i="'+i+'">'+o.label+'</button>').join('');
    document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));}
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
function feedback(ok,t){
  $('fb').className='fb '+(ok?'ok':'bad');
  $('fb').innerHTML='<b class="h">'+(ok?'Верно!':'Неверно.')+'</b>'+show_f(t.x)+' — '+allNames(t.x)+(t.x.alt?'. Можно записать и так: '+t.x.alt.map(toSub).join(', '):'');
  $('check').classList.add('hidden');$('next').classList.remove('hidden');
  $('next').textContent=cur===tasks.length-1?'Посмотреть результат':'Дальше';$('next').focus();
}
function choose(i){
  if(answered)return;const t=tasks[cur];const o=t.opts[i];const ok=o.y===t.x;answered=true;
  document.querySelectorAll('#opts .opt').forEach((b,j)=>{b.disabled=true;if(t.opts[j].y===t.x)b.classList.add('right');else if(j===i)b.classList.add('wrong');});
  log.push({t,ok,user:o.label,correct:t.l===1?show_f(t.x):t.name});
  feedback(ok,t);
}
function check(){
  const t=tasks[cur];if(answered||t.l!==3)return;const u=fin.value.trim();
  if(!u){$('qErr').textContent='Напиши формулу';return;}
  const ok=[t.x.f,...(t.x.alt||[])].some(a=>norm(a)===norm(u));
  answered=true;fin.readOnly=true;fin.classList.add(ok?'right':'wrong');
  log.push({t,ok,user:u,correct:show_f(t.x)});
  feedback(ok,t);
  if(!ok&&norm(u).toLowerCase()===norm(t.x.f).toLowerCase())$('fb').innerHTML+='<br>Проверь заглавные и строчные буквы.';
}
function next(){if(!answered)return;cur++;cur<tasks.length?show():finish();}
function finish(){
  const right=log.filter(x=>x.ok).length,n=log.length,sec=Math.round((Date.now()-t0)/1000);
  const d=new Date(),pad=x=>String(x).padStart(2,'0');
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
  $('rName').textContent='Уровень: '+LVL[curLevel];
  $('rMeta').textContent=pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+', '+pad(d.getHours())+':'+pad(d.getMinutes())+' · время: '+Math.floor(sec/60)+' мин '+pad(sec%60)+' с';
  $('rScore').innerHTML=right+'<small>/'+n+'</small>';
  const p=Math.round(right/n*100);
  $('rVerdict').textContent=p===100?'Идеально!':p>=90?'Отлично!':p>=75?'Хорошо':p>=50?'Нужно потренироваться':'Повтори названия и попробуй снова';
  $('rPct').textContent=p+'% правильных ответов';
  $('rGrid').innerHTML=log.map((x,i)=>'<div class="'+(x.ok?'g':'r')+'">'+(i+1)+'</div>').join('');
  const bad=log.map((x,i)=>({...x,i})).filter(x=>!x.ok);
  $('rMist').innerHTML=bad.length===0?'<div class="perfect">Ни одной ошибки</div>':
    '<h3>Ошибки</h3><table><tr><th>№</th><th>Вопрос</th><th>Ответ</th><th>Верно</th></tr>'+
    bad.map(x=>'<tr><td>'+(x.i+1)+'</td><td>'+(x.t.l===2?show_f(x.t.x):x.t.name)+'</td><td class="no">'+x.user.replace(/</g,'&lt;')+'</td><td class="yes">'+x.correct+'</td></tr>').join('')+'</table>';
  window.scrollTo(0,0);
}
$('levels').innerHTML=Object.entries(LEVEL_INFO).map(([k,v],i)=>'<button class="lv-btn" type="button" data-l="'+k+'"><span class="dot">'+(i+1)+'</span><span><b>'+v[0]+'</b><small>'+v[1]+'</small></span></button>').join('');
document.querySelectorAll('.lv-btn').forEach(b=>b.onclick=()=>start(+b.dataset.l));
$('check').onclick=check;$('next').onclick=next;
$('againLvl').onclick=()=>start(curLevel);
$('toLevels').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('start').classList.remove('hidden');window.scrollTo(0,0);};
document.addEventListener('keydown',e=>{if($('quiz').classList.contains('hidden')||e.key!=='Enter')return;if(!answered&&tasks[cur].l!==3)return;e.preventDefault();answered?next():check();});

/* ---- полоска прогресса и сохранение результата ---- */
(function(){
  const API=(()=>{let a=new URLSearchParams(location.search).get('api');try{if(a)sessionStorage.setItem('api',a);else a=sessionStorage.getItem('api');}catch(e){}return a;})();
  const css=document.createElement('style');
  css.textContent='#quiz .bar{display:none}.seg{display:flex;gap:3px;margin:-4px 0 4px}.seg i{flex:1;height:8px;border-radius:4px;background:#ece8f8;transition:background .2s}.seg i.g{background:#1f9d6b}.seg i.r{background:#e0475b}.seg i.c{background:#8153EC;box-shadow:0 0 0 2px #d9ccff}.segl{text-align:right;font-size:12px;color:#737373;margin-bottom:14px}.saved{margin:0 0 16px;background:#e3f6ee;color:#1f9d6b;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;display:inline-block}';
  document.head.appendChild(css);
  const bar=document.querySelector('#quiz .bar');const seg=document.createElement('div');seg.className='seg';const segl=document.createElement('div');segl.className='segl';
  bar.after(seg);seg.after(segl);
  function paint(){if(!tasks.length)return;seg.innerHTML=tasks.map((t,i)=>'<i class="'+(i<log.length?(log[i].ok?'g':'r'):(i===cur?'c':''))+'"></i>').join('');const left=tasks.length-log.length;segl.textContent=left?'осталось '+left:'все задания пройдены';}
  const _show=show;show=function(){_show.apply(this,arguments);paint();};
  const _check=check;check=function(){_check.apply(this,arguments);paint();};
  const _choose=choose;choose=function(){_choose.apply(this,arguments);paint();};
  const _finish=finish;finish=function(){_finish.apply(this,arguments);save();};
  document.getElementById('check').onclick=()=>check();
  function save(){
    const old=document.querySelector('#result .saved');if(old)old.remove();
    const tg=window.Telegram&&window.Telegram.WebApp;if(!API||!tg||!tg.initData)return;
    const mistakes=[...document.querySelectorAll('#rMist tr')].slice(1).map(tr=>tr.cells[1]?tr.cells[1].innerText.replace(/\s+/g,' ').trim():'').filter(Boolean);
    const body={initData:tg.initData,file:location.pathname.split('/').pop(),level:curLevel,score:log.filter(x=>x.ok).length,total:log.length,sec:Math.round((Date.now()-t0)/1000),mistakes};
    fetch(API.replace(/\/$/,'')+'/api/result',{method:'POST',headers:{'content-type':'text/plain'},body:JSON.stringify(body)})
      .then(r=>r.json()).then(j=>{if(j.ok){const d=document.createElement('div');d.className='saved';d.textContent='✓ Результат сохранён';const sc=document.querySelector('#result .score');if(sc)sc.after(d);}}).catch(()=>{});
  }
})();
</script>
<script>
/* ---- лучший результат ученика на кнопках уровней ---- */
(function(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  let API=null;try{API=new URLSearchParams(location.search).get('api')||sessionStorage.getItem('api');}catch(e){}
  if(!API||!tg||!tg.initData)return;
  const file=location.pathname.split('/').pop();
  const css=document.createElement('style');
  css.textContent='.lv-best{margin-left:auto;flex:none;font-size:13px;font-weight:700;border-radius:8px;padding:5px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}.lv-best.c3{background:#e3f6ee;color:#1f9d6b}.lv-best.c2{background:#fff2dc;color:#c27a00}.lv-best.c1{background:#fde8eb;color:#e0475b}';
  document.head.appendChild(css);
  function paint(rows){
    const best={};
    rows.filter(r=>r.file===file).forEach(r=>{const b=best[r.level];if(!b||r.score/r.total>b.score/b.total)best[r.level]=r;});
    document.querySelectorAll('.lv-btn[data-l]').forEach(btn=>{
      let s=btn.querySelector('.lv-best');const b=best[btn.dataset.l];
      if(!b){if(s)s.remove();return;}
      if(!s){s=document.createElement('span');btn.appendChild(s);}
      const p=b.score*100/b.total;
      s.className='lv-best '+(p>=85?'c3':p>=60?'c2':'c1');
      s.textContent=(p>=70?'✓ ':'')+b.score+'/'+b.total;
      s.title='Твой лучший результат';
    });
  }
  function load(){
    fetch(API.replace(/\/$/,'')+'/api/me',{method:'POST',headers:{'content-type':'text/plain'},body:JSON.stringify({initData:tg.initData})})
      .then(r=>r.json()).then(d=>{if(d.ok)paint(d.rows||[]);}).catch(()=>{});
  }
  load();
  const tl=document.getElementById('toLevels');if(tl)tl.addEventListener('click',load);
})();
</script>
