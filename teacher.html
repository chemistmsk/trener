<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет преподавателя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>

:root{--pu:#8153EC;--pu-d:#6a3fd6;--lv:#EFEAFF;--lv2:#E3DAFF;--ln:#D9CCFF;--ink:#1d1b26;--grey:#737373;--ok:#1f9d6b;--ok-bg:#e3f6ee;--bad:#e0475b;--bad-bg:#fde8eb;--bg:#f7f5ff;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-weight:500}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
.back{display:inline-flex;gap:6px;color:var(--pu);font-weight:600;font-size:14px;text-decoration:none;margin-bottom:14px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-family:Unbounded,Montserrat,sans-serif;font-weight:600;color:var(--pu);font-size:24px;margin:0}
.head span{color:#be9fff;font-size:15px}
.line{height:3px;width:220px;border-radius:2px;background:linear-gradient(90deg,var(--pu),#c553ec);margin-bottom:22px}
.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 2px 0 var(--ln),0 10px 30px rgba(129,83,236,.08)}
.pill{display:inline-block;font-family:Unbounded,Montserrat,sans-serif;font-size:13px;color:var(--pu);background:var(--lv);border:1.5px solid var(--pu);border-radius:7px;padding:4px 10px;box-shadow:3px -2px 0 var(--lv2)}
label{display:block;font-weight:600;margin:18px 0 6px}
input.name{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;outline:none}
input.name:focus{border-color:var(--pu)}
.rules{margin:16px 0 0;padding-left:20px;line-height:1.6}
.rules b{color:var(--pu)}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;background:var(--pu);color:#fff}
.btn:hover{background:var(--pu-d)}
.btn.ghost{background:var(--lv);color:var(--pu)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:18px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--grey);margin-bottom:8px}
.bar{height:8px;background:var(--lv);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),#c553ec);width:0;transition:width .3s}
.lvl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--pu);background:var(--lv);padding:4px 9px;border-radius:20px}
.q{text-align:center;margin:4px 0 10px;color:var(--grey);font-size:15px}
.el{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0 20px}
.sym{font-size:44px;font-weight:700;color:var(--pu);background:var(--lv);border-radius:14px;padding:6px 16px;box-shadow:inset 0 -3px 0 var(--pu);line-height:1.2}
.sym sup{font-size:.45em}
.el small{display:block;color:var(--grey);font-size:14px}
.el b{font-size:18px}
/* layers */
.scheme{display:flex;align-items:flex-start;justify-content:center;gap:6px;font-weight:700}
.nuc{color:var(--pu);font-size:24px;height:84px;display:flex;align-items:center;margin-right:2px}
.shell{display:flex;flex-direction:column;align-items:center;gap:6px}
.arc{align-self:flex-start;width:23px;height:84px;border-right:3px solid var(--pu);border-radius:0 50% 50% 0 / 0 50% 50% 0;opacity:.55}
.shell .cell{width:46px;height:44px;font-size:20px}
.cell{width:56px;height:52px;text-align:center;font:700 22px Montserrat,sans-serif;border:1.5px solid var(--ln);border-radius:12px;outline:none;color:var(--ink);background:#fff}
.cell:focus{border-color:var(--pu)}
.cell.right{border-color:var(--ok);background:var(--ok-bg)}
.cell.wrong{border-color:var(--bad);background:var(--bad-bg)}
.lwrap{overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.ladder{--c:32px;display:grid;grid-template-columns:repeat(19,var(--c));grid-auto-rows:var(--c);width:max-content;margin:0 auto}
.ll{display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap}
.orb{width:var(--c);height:var(--c);border:0;outline:1.5px solid var(--pu);outline-offset:-.75px;background:#fff;font:700 16px Montserrat,sans-serif;color:var(--pu);cursor:pointer;padding:0;letter-spacing:-2px;display:grid;place-items:center}
.orb:hover{background:var(--lv)}
.orb .ar{height:80%;width:auto;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.orb .pair{display:flex;gap:1px;height:100%;align-items:center;justify-content:center}
.orb:focus-visible{outline:3px solid #c553ec;z-index:1}
.orb:disabled{cursor:default}
.orb.right{outline-color:var(--ok);background:var(--ok-bg);color:var(--ok);z-index:1}
.orb.wrong{outline-color:var(--bad);background:var(--bad-bg);color:var(--bad);z-index:2}
.ll.right{color:var(--ok)} .ll.wrong{color:var(--bad)}
.mini{--c:20px;margin-top:10px}
.mini .orb{font-size:11px;outline-color:var(--ok);color:var(--ok);background:#fff;letter-spacing:-1px}
.mini .ll{font-size:10px;padding-right:3px}
.swipe{display:none;font-size:12px;color:var(--grey);text-align:center}
@media (max-width:560px){.ladder{--c:26px}.orb{font-size:13px}.swipe{display:block}}
/* config */
.subs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sub{display:flex;flex-direction:column;align-items:center;gap:4px}
.sub span{font-weight:700;font-size:16px}
.sub em{font-style:normal;font-size:11px;color:var(--grey)}
.sub .cell{width:100%;max-width:58px;height:48px;font-size:20px}
.order{font-size:12px;color:var(--grey);text-align:center;margin-top:8px}
.preview{text-align:center;font-size:20px;font-weight:600;margin-top:14px;min-height:30px;letter-spacing:.3px}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;line-height:1.55;display:none}
.fb.ok{display:block;background:var(--ok-bg)} .fb.bad{display:block;background:var(--bad-bg)}
.fb b.h{display:block;margin-bottom:2px}
.fb.ok b.h{color:var(--ok)} .fb.bad b.h{color:var(--bad)}
.hint{font-size:13px;color:var(--grey);margin-top:12px;text-align:center}
.res-name{font-size:18px;font-weight:700}
.res-meta{color:var(--grey);font-size:14px;margin-top:4px}
.score{display:flex;align-items:center;gap:20px;margin:22px 0;flex-wrap:wrap}
.score .big{font-family:Unbounded,Montserrat,sans-serif;font-size:64px;color:var(--pu);line-height:1}
.score .big small{font-size:.45em;color:var(--grey)}
.score .verdict{font-size:18px;font-weight:700}
.score .pct{color:var(--grey);font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:20px}
.grid div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.grid .g{background:var(--ok)} .grid .r{background:var(--bad)}
.mist h3{font-size:15px;margin:0 0 8px;color:var(--pu)}
.mist table{width:100%;border-collapse:collapse;font-size:14px}
.mist td,.mist th{border:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top}
.mist td{overflow-wrap:anywhere}
.mist th{background:var(--lv);color:var(--pu)}
.mist .no{color:var(--bad);font-weight:600} .mist .yes{color:var(--ok);font-weight:600}
.perfect{background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:12px;padding:12px 16px}
.foot{font-size:12px;color:var(--grey);margin-top:16px}
.hidden{display:none}
@media (max-width:560px){
  .subs{grid-template-columns:repeat(4,1fr)}
  .card{padding:18px}
  .cell{width:48px;height:48px;font-size:20px}
  .score .big{font-size:52px}
  .grid{gap:4px}
}

.wrap{max-width:1000px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--lv);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:26px;color:var(--pu);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--grey)}
.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;border-bottom:1px solid #f0eef6;text-align:left;white-space:nowrap}
th{font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.04em}
tr.u{cursor:pointer} tr.u:hover td{background:#faf8ff}
.pl{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700}
.p3{background:#e3f6ee;color:var(--ok)}.p2{background:#fff2dc;color:#c27a00}.p1{background:#fde8eb;color:var(--bad)}
.pc{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:3px 0;font-weight:700;font-size:12px}
.c0{background:#f1f1f4;color:#aaa}.c1{background:#fde8eb;color:var(--bad)}.c2{background:#fff2dc;color:#c27a00}.c3{background:#e3f6ee;color:var(--ok)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}
.box{border:1px solid #eee;border-radius:14px;padding:14px;min-width:0}
.box h3{margin:0 0 10px;font-size:15px}
.er{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #eee;font-size:14px}
.er i{font-style:normal;color:var(--grey);white-space:nowrap}
.er small{color:var(--grey)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-bottom:18px}
.bars div{flex:1;background:linear-gradient(#c553ec,var(--pu));border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;bottom:-17px;left:-4px;right:-4px;text-align:center;font-size:9px;color:var(--grey)}
.bars div b{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10px;color:var(--grey)}
#detail{display:none;margin-top:18px}
#detail.on{display:block}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{background:var(--lv);color:var(--pu);border:0;border-radius:10px;padding:8px 12px;font:600 14px Montserrat,sans-serif;cursor:pointer}
.ex{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--grey);margin:14px 0 4px}
.trr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f4f2f9;font-size:14px}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;font-variant-numeric:tabular-nums}
.hrow span:first-child{color:var(--grey)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1b26;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;display:none}
.empty{color:var(--grey);text-align:center;padding:30px 0}
.note{font-size:13px;color:var(--grey);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>Кабинет преподавателя</h1></div>
  <div class="line"></div>
  <section class="card" id="box"><div class="empty">Загружаю…</div></section>
  <section class="card" id="detail"></section>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();}catch(e){}}
const API=(()=>{let a=new URLSearchParams(location.search).get('api');try{if(a)sessionStorage.setItem('api',a);else a=sessionStorage.getItem('api');}catch(e){}return a;})();
const LV={1:'лёгкий',2:'средний',3:'сложный'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=p=>p==null?'c0':p>=85?'c3':p>=60?'c2':'c1';
const name=u=>[u.first_name,u.last_name].filter(Boolean).join(' ')||(u.username?'@'+u.username:'id'+u.id);
const fmtD=ts=>{const d=new Date(ts*1000),p=x=>String(x).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());};
function call(path,body){return fetch(API.replace(/\/$/,'')+path,{method:'POST',headers:{'content-type':'text/plain'},body:JSON.stringify({initData:tg.initData,...body})}).then(r=>r.json());}
function fail(el,msg){$(el).innerHTML='<div class="empty">'+esc(msg)+'</div>';}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500);}
function ago(ts,now){const d=Math.floor((now-ts)/86400);if(new Date(ts*1000).toDateString()===new Date(now*1000).toDateString())return ['сегодня','p3'];if(d<1)return ['вчера','p3'];return [d+' дн.',d<3?'p3':d<7?'p2':'p1'];}

function load(){
  if(!tg||!tg.initData||!API)return fail('box','Открой кабинет через кнопку в боте.');
  call('/api/teacher',{}).then(d=>d.ok?render(d):fail('box',d.error||'Ошибка')).catch(()=>fail('box','Нет связи с ботом, попробуй позже.'));
}
function render(d){
  const week=d.users.filter(u=>d.now-u.last_seen<7*86400).length;
  const withRes=d.users.filter(u=>u.attempts);
  const avg=withRes.length?Math.round(withRes.reduce((s,u)=>s+u.avg,0)/withRes.length):null;
  const bt={};d.byTask.forEach(r=>bt[r.user_id+'|'+r.task]=Math.round(r.avg));
  const max=Math.max(1,...d.days.map(x=>x.n));
  $('box').innerHTML='<div class="kpis"><div class="kpi"><b>'+d.users.length+'</b><span>учеников</span></div><div class="kpi"><b>'+week+'</b><span>активны за неделю</span></div><div class="kpi"><b>'+d.totalResults+'</b><span>тренажёров пройдено</span></div><div class="kpi"><b>'+(avg==null?'—':avg+'%')+'</b><span>средний результат</span></div></div>'+
   (d.users.length?'<div class="tbl"><table><tr><th>Ученик</th><th>Был</th>'+d.tasks.map(t=>'<th>'+esc(t.title)+'</th>').join('')+'<th>Попыток</th><th>Средний</th></tr>'+
    d.users.map(u=>{const a=ago(u.last_seen,d.now);return '<tr class="u" data-id="'+u.id+'"><td><b>'+esc(name(u))+'</b>'+(u.remind?'':' <small title="напоминания отключены">🔕</small>')+'</td><td><span class="pl '+a[1]+'">'+a[0]+'</span></td>'+
      d.tasks.map(t=>{const p=bt[u.id+'|'+t.key];return '<td><span class="pc '+cls(p)+'">'+(p==null?'—':p+'%')+'</span></td>';}).join('')+
      '<td>'+u.attempts+'</td><td>'+(u.attempts?Math.round(u.avg)+'%':'—')+'</td></tr>';}).join('')+'</table></div>':'<div class="empty">Пока никто из учеников не заходил в бота.</div>')+
   '<div class="two"><div class="box"><h3>Где чаще всего ошибаются</h3>'+(d.top.length?d.top.map(m=>'<div class="er"><span>'+esc(m.text)+' <small>· '+esc(m.trainer)+'</small></span><i>'+m.count+' раз · '+m.users+' уч.</i></div>').join(''):'<div class="note">Ошибок пока нет.</div>')+'</div>'+
   '<div class="box"><h3>Активность за 2 недели</h3><div class="bars">'+d.days.map(x=>'<div style="height:'+Math.max(2,x.n/max*100)+'%"><b>'+(x.n||'')+'</b><span>'+x.d.slice(8)+'.'+x.d.slice(5,7)+'</span></div>').join('')+'</div></div></div>'+
   '<div class="row"><button class="btn ghost" id="exp">Прислать таблицу в бот</button><button class="btn ghost" id="upd">Обновить</button></div>'+
   '<p class="note">Нажми на ученика — откроется его история. 🔕 — ученик отключил напоминания.</p>';
  document.querySelectorAll('tr.u').forEach(r=>r.onclick=()=>openStudent(+r.dataset.id));
  $('exp').onclick=()=>call('/api/export',{}).then(()=>toast('Файл отправлен в чат с ботом')).catch(()=>toast('Не получилось'));
  $('upd').onclick=load;
}
function openStudent(id){
  const box=$('detail');box.classList.add('on');box.innerHTML='<div class="empty">Загружаю…</div>';box.scrollIntoView({behavior:'smooth'});
  call('/api/student',{id}).then(d=>{
    if(!d.ok)return fail('detail',d.error||'Ошибка');
    const best={},last={};d.rows.slice().reverse().forEach(r=>{const k=r.file+'|'+r.level,p=Math.round(r.score*100/r.total);best[k]=Math.max(best[k]??-1,p);last[k]=p;});
    let html='';
    d.menu.exams.forEach(ex=>(ex.tasks||[]).forEach(t=>{const trs=(t.trainers||[]).filter(x=>x.file);if(!trs.length)return;
      html+='<div class="ex">'+esc(ex.title)+' · '+esc(t.title)+'</div>';
      trs.forEach(tr=>{let c='';for(let l=1;l<=(tr.levels||3);l++){const p=best[tr.file+'|'+l];c+='<span class="pc '+cls(p)+'" title="'+LV[l]+(p!=null?', последний '+last[tr.file+'|'+l]+'%':'')+'">'+(p==null?'—':p+'%')+'</span> ';}
        html+='<div class="trr"><span>'+esc(tr.title)+'</span><span>'+c+'</span></div>';});}));
    const mist={};d.rows.forEach(r=>JSON.parse(r.mistakes||'[]').forEach(m=>{const k=r.title+': '+m;mist[k]=(mist[k]||0)+1;}));
    const top=Object.entries(mist).sort((a,b)=>b[1]-a[1]).slice(0,8);
    box.innerHTML='<div class="dh"><h2 style="margin:0;font-size:18px">'+esc(name(d.user))+(d.user.username?' <small style="color:#737373">@'+esc(d.user.username)+'</small>':'')+'</h2><button class="close" id="cls">Закрыть</button></div>'+
      '<div class="note">Попыток: '+d.rows.length+'. Клетки — лучший результат по уровням (лёгкий / средний / сложный).</div>'+html+
      '<div class="two"><div class="box"><h3>Частые ошибки</h3>'+(top.length?top.map(([k,n])=>'<div class="er"><span>'+esc(k)+'</span><i>×'+n+'</i></div>').join(''):'<div class="note">Ошибок нет.</div>')+'</div>'+
      '<div class="box"><h3>Последние попытки</h3>'+(d.rows.length?d.rows.slice(0,15).map(r=>'<div class="hrow"><span>'+fmtD(r.ts)+'</span><span>'+esc(r.title)+' · '+LV[r.level]+'</span><b>'+r.score+'/'+r.total+'</b></div>').join(''):'<div class="note">Пока нет.</div>')+'</div></div>';
    $('cls').onclick=()=>{box.classList.remove('on');window.scrollTo({top:0,behavior:'smooth'});};
  }).catch(()=>fail('detail','Нет связи с ботом.'));
}
load();
</script>
</body>
</html>
